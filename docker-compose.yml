version: '3.8'

services:
  # ─── MongoDB Database ───────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: rhythm-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rhythm-network

  # ─── Redis Cache & Socket Pub/Sub ───────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: rhythm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rhythm-network

  # ─── Rhythm Backend API & Socket Server ─────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rhythm-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/rhythm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=rhythm_jwt_access_super_secret_production_key_32chars
      - JWT_REFRESH_SECRET=rhythm_jwt_refresh_super_secret_production_key_32chars
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
      - COOKIE_DOMAIN=localhost
      - COOKIE_SECURE=false
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rhythm-network

  # ─── Rhythm Frontend Web App & Nginx Gateway ────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rhythm-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - rhythm-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  rhythm-network:
    driver: bridge
